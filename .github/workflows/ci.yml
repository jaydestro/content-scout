name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint prompt + agent files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prompt files exist
        run: |
          test -f .github/agents/content-scout.agent.md
          test -f .github/prompts/scout-onboard.prompt.md
          test -f .github/prompts/scout-scan.prompt.md
          test -f .github/prompts/scout-post.prompt.md
          test -f .github/prompts/scout-calendar.prompt.md

  test:
    name: Web UI unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install web UI dependencies
        working-directory: tools/web-ui
        run: npm install --no-audit --no-fund

      - name: Install thumbnail renderer dependencies
        working-directory: tools/render-thumbnails
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: tools/web-ui
        run: |
          node --check server.js
          for f in lib/*.js public/*.js; do node --check "$f"; done

      - name: Run unit tests
        working-directory: tools/web-ui
        run: npm test

  storage-platform:
    name: SQLite storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install web UI dependencies
        working-directory: tools/web-ui
        run: npm install --no-audit --no-fund

      - name: Run SQLite repository and Express integration tests
        run: node --test tools/web-ui/test/sqlite-store.test.js tools/web-ui/test/sqlite-server.test.js
